        # Enforcement action - Data Protection Authority fines analytics vendor (Sept 5 2026)

        **Type:** enforcement  **Jurisdiction:** EU  **Practice area:** privacy

        The supervisory authority fined a mid-sized analytics processor EUR 2.1M for transferring personal data to processors in third countries while relying on a lapsed adequacy framework rather than standard contractual clauses, and for failing to keep its published sub-processor list current. The decision stresses that a stale sub-processor list is itself an infringement, not merely a contractual matter.
