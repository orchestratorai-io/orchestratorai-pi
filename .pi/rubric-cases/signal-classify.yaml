        # Proposed legislation - State Worker Classification Enforcement Act (Sept 2 2026)

        **Type:** legislation  **Jurisdiction:** State of Demo  **Practice area:** employment

        Bill would extend the limitations period for misclassification claims from two to four years and permit the state agency to open an audit on a single worker complaint. Committee hearing scheduled for October.
