name: monte-carlo-trial-simulator
description: Run a structured case record through repeated simulated mini-trials. Each simulation draws a different jury, judge, evidence-admission and witness-credibility profile, adversarial counsel argue both sides, a jury returns a verdict, and the outcomes are aggregated into a distribution, settlement band and sensitivity analysis.
trigger: when the user asks to simulate trial outcomes or estimate a settlement range from a case record
params:
  - { name: target, required: true, description: "Path to the structured case record" }
  - { name: simulations, default: "4", description: "How many simulated trials to run" }
  - { name: context, default: "Estimate the outcome distribution and a settlement band for case evaluation.", description: Objective }
  - { name: run_id, default: "", description: "OrchestratorAI run id (set by the app; leave empty from the TUI)" }
doc: |-
  Composition: parameter designer -> map(simulations) { plaintiff counsel and defence counsel in parallel
  -> jury verdict } -> statistician -> report.
  Ported from orchestratorai-local `legal/workflows/monte-carlo-trial-simulator`. Local runs up to 200
  simulations; on local hardware each mini-trial is three agent calls, so the default here is 4 and the
  report states the sample size honestly. Every output carries a standing simulation disclaimer.

  ```orchestrator-launch
  title: Trial Simulator
  icon: chart.line.uptrend.xyaxis
  group: litigation
  file: { label: case record, param: target }
  fields:
    - { param: simulations, label: Simulations, kind: choice, options: ["3", "4", "6", "8"] }
    - { param: context, label: Objective, kind: text }
  samples:
    - { title: Harbor Peak v. Aspen case record (synthetic), path: fixtures/litigation/case-record.md }
  review:
    focusTitle: Attorney review focus
    focusSubtitle: Simulated outcomes from a small sample. Treat the range as indicative and check the sensitivity factors.
    blurb: Confirm the assumptions behind the distribution before using it in case evaluation. These are simulated outcomes, not a prediction and not legal advice.
  ```

  ```orchestrator-guards
  step: report
  checks:
    - { guard: citations, record: ["{params.target}"], record_steps: [statistics, simulate], skip: [Disclaimer, Limitations, Quality guards] }
    - { guard: severity }
  ```
flow:
  kind: sequence
  steps:
    - kind: agent
      profile: trial-parameter-designer
      label: parameters
      task: |-
        Read the case record at {params.target} completely, then design exactly {params.simulations}
        stratified parameter sets for simulated trials.
        Objective: {params.context}

        Each entry needs: id (SIM-n), jury (composition and leanings), judge (profile and evidentiary
        posture), evidence (which contested items are admitted and which excluded, by name from the
        record), and witnesses (credibility modifiers by name).

        CLOSED RECORD: use only evidence and witnesses named in the record. Each field must stay under
        80 words. Use generic judge and jury descriptions; never invent names, vote splits, demographics,
        instructions, venue facts, or prior rulings. All scenario details are assumptions, not facts or law.
        Preserve asserted, contested, and not-yet-ruled admissibility status exactly; an assumed scenario
        outcome may not claim the real court resolved the issue or invent a legal reason for it.

        Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
      json:
        type: object
        required: [simulations]
        properties:
          simulations:
            type: array
            minItems: 1
            items:
              type: object
              required: [id, jury, judge, evidence, witnesses]
              properties:
                id: { type: string }
                jury: { type: string }
                judge: { type: string }
                evidence: { type: string }
                witnesses: { type: string }
              additionalProperties: false
        additionalProperties: false
      as: space

    - kind: map
      label: simulate
      over: "{space.simulations}"
      concurrency: 1
      body:
        kind: sequence
        steps:
          - kind: parallel
            label: argument
            onError: collect
            branches:
              plaintiff:
                kind: agent
                profile: trial-advocate
                label: plaintiff-counsel
                task: |-
                  You are PLAINTIFF's counsel in simulation {item.id}.
                  Case record: {params.target} (read it).
                  Jury: {item.jury}
                  Judge: {item.judge}
                  Evidence admitted/excluded in this simulation: {item.evidence}
                  Witness credibility in this simulation: {item.witnesses}

                  Stay under 600 words. Use only the record and this parameter set. Do not add law,
                  dates, amounts, procedural events, or rulings. Prefix jury inferences with `Argument:`.

                  Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
              defense:
                kind: agent
                profile: trial-advocate
                label: defense-counsel
                task: |-
                  You are DEFENCE counsel in simulation {item.id}.
                  Case record: {params.target} (read it).
                  Jury: {item.jury}
                  Judge: {item.judge}
                  Evidence admitted/excluded in this simulation: {item.evidence}
                  Witness credibility in this simulation: {item.witnesses}

                  Stay under 600 words. Use only the record and this parameter set. Do not add law,
                  dates, amounts, procedural events, or rulings. Prefix jury inferences with `Argument:`.

                  Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
            as: args
          - kind: agent
            profile: trial-jury
            label: jury
            task: |-
              Deliberate and return the verdict for simulation {item.id}.
              Jury composition: {item.jury}
              Judge: {item.judge}
              Evidence admitted/excluded: {item.evidence}
              Witness credibility: {item.witnesses}

              PLAINTIFF CASE:
              {args.plaintiff}

              DEFENCE CASE:
              {args.defense}

              Stay under 250 words. Use only these inputs. A defense verdict MUST use damages 0; a
              plaintiff or mixed verdict MUST copy one exact nonzero dollar figure printed in the
              record and name its damages theory. Do not calculate a midpoint, compromise, percentage,
              multiplier, or new figure. Never invent a judge name, vote count, jury instruction,
              damages cap, or quote. Begin reasoning with `In this simulation,` and do not state actual
              law, rulings, or facts beyond the record.

              Return JSON with simulationId ("{item.id}"), verdict, damages (a number, 0 for a defence
              verdict), keyFactors (2-4 short strings), and reasoning.

              Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
            json:
              type: object
              required: [simulationId, verdict, damages, keyFactors, reasoning]
              properties:
                simulationId: { type: string }
                verdict: { type: string }
                damages: { type: number }
                keyFactors: { type: array, items: { type: string } }
                reasoning: { type: string }
              additionalProperties: false
      as: verdicts

    - kind: agent
      profile: trial-statistician
      label: statistics
      task: |-
        Aggregate the simulated outcomes. Sample size: {params.simulations}.
        Objective: {params.context}

        PARAMETER SETS:
        {space.simulations}

        VERDICTS:
        {verdicts}

        Stay under 1,200 words. Show arithmetic for rates, mean, median, and expected value. With fewer
        than 10 outcomes report min/max rather than interpolated percentiles. Label every sensitivity
        conclusion `Simulation association:` and do not claim causation, probability, prediction, or
        statistical significance.

        Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
      as: stats

    - kind: agent
      profile: trial-report-writer
      label: report
      task: |-
        Write the trial simulation report for the case record at {params.target}.
        Sample size: {params.simulations} simulations.

        The first line must be exactly:
        # Trial simulation - [case name]
        Then: ## Disclaimer, ## Executive summary, ## Attorney review focus, ## Outcome distribution,
        ## Damages distribution, ## Settlement range, ## Sensitivity analysis, ## Strategy recommendations,
        ## Simulation log, ## Limitations. Repeat the disclaimer at the end.

        Under ## Attorney review focus list unchecked tasks `- [ ] SEVERITY - issue; action`: any
        assumption the distribution is sensitive to is HIGH, small-sample caveats are MEDIUM.
        Prefer 4-8 items.

        STATISTICS:
        {stats}

        VERDICTS:
        {verdicts}

        CLOSED RECORD: stay under 2,000 words. Preserve supplied statistics; do not add or recalculate
        facts, law, dates, amounts, procedural events, or causal claims. Attribute verdict reasoning to
        its SIM id. Prefix synthesis with `Simulation assessment:` and advice with `Recommendation:`.
        Never turn scenario frequency into probability. Never say a simulated judge or jury actually
        ruled, an assumption caps or triggers damages, or a defense legally absolves a party. The
        simulation log may contain only SIM id, verdict, damages, supplied key factors, and at most one
        reasoning sentence; omit invented names, votes, instructions, quotes, and narrative detail.
        If admissibility is asserted, contested, or not yet ruled on in the source, say so and describe
        admission/exclusion only as a scenario assumption; never say an exception was established.
        Every checklist line MUST begin exactly `- [ ] HIGH —`,
        `- [ ] MEDIUM —`, or `- [ ] LOW —`; admission, liability, damages, and sample-size issues may
        not be LOW.

        Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
      as: draft

    # Quality guards (see the orchestrator-guards block in doc): Clef checks the finished report,
    # and the result is appended to it, so the attorney reviews the report and its guard section together.
    - kind: switch
      label: quality-guards
      on: "{params.run_id}"
      cases:
        - when: { eq: ["", ""] }
          then:
            kind: value
            value: |-
              ## Quality guards

              - **Quality guards: Pending scorecard.** Terminal runs are scored locally after completion.
      else:
        kind: agent
        profile: guard-gate
        label: quality-guards-agent
        task: |-
          Call the report_guard tool exactly once with run_id "{params.run_id}".
          Then submit the tool's returned Markdown verbatim as your result.
      as: guards

    - kind: value
      label: guarded-report
      value: |-
        {draft}

        {guards}
      as: report
display: report
