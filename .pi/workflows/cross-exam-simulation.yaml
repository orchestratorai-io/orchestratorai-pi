name: cross-exam-simulation
description: Put a witness through an adaptive cross-examination. The simulator asks one question at a time and waits for the witness's answer, scores each answer on evasion, consistency and damage, adapts the next question, and produces a debrief with the weakest moments and coaching.
trigger: when the user asks to simulate or practise a cross-examination
params:
  - { name: witness, required: true, description: "Witness name, role, and background" }
  - { name: case_facts, default: "Harbor Peak alleges Aspen used its data-pipeline architecture after an NDA evaluation. Aspen says its engineers relied only on residuals retained in memory.", description: "Case facts and posture" }
  - { name: focus, default: "No particular focus - follow the strategy", description: "Optional focus area" }
  - { name: knowledge_dir, default: "matters", description: "Folder searched for prior statements and documents" }
  - { name: run_id, default: "", description: "OrchestratorAI run id (set by the app; leave empty from the TUI)" }
doc: |-
  Composition: strategist -> while(max 5) { question -> attorney gate (you answer as the witness) ->
  scorer } until the answer says stop -> debriefer.
  Ported from orchestratorai-local `legal/workflows/cross-exam-simulation`. The interactive turn loop uses
  the same `attorney_review` gate as every other HITL point: the question appears in the console and your
  typed answer becomes the witness's testimony for that turn. Type "end simulation" to stop early.

  ```orchestrator-launch
  title: Cross-Exam Simulation
  icon: person.2.wave.2
  group: litigation
  file: { kind: none }
  fields:
    - { param: witness, label: Witness, kind: line, default: "Dana Ruiz - VP Engineering, Aspen Devices" }
    - { param: case_facts, label: Case facts, kind: text, default: "Harbor Peak alleges Aspen used its data-pipeline architecture after an NDA evaluation. Aspen says its engineers relied only on residuals retained in memory." }
    - { param: focus, label: Focus area, kind: line }
    - { param: knowledge_dir, label: Knowledge folder, kind: line }
  review:
    focusTitle: Coaching focus
    focusSubtitle: Work the weakest moments with the witness. Answer each question in the gate note as the witness would.
    blurb: Review the transcript, scores, and coaching before the real deposition. Recording Approve or Request changes completes the attorney-review checkpoint.
  ```

  ```orchestrator-guards
  step: debrief
  checks:
    - { guard: coaching, include: [Coaching recommendations] }
    - { guard: citations, record: ["{params.knowledge_dir}"], record_text: "{params.witness}. {params.case_facts}", record_steps: [examination], skip: [Transcript, Limitations, Quality guards] }
    - { guard: severity }
  ```
flow:
  kind: sequence
  steps:
    - kind: agent
      profile: xexam-strategist
      label: strategist
      task: |-
        Build the cross-examination strategy.
        Witness: {params.witness}
        Case facts: {params.case_facts}
        Focus area: {params.focus}
        Prior statements and documents to search (may be empty): {params.knowledge_dir}
        Make one grep call inside that folder using the witness name and central issue as alternatives,
        with at most 8 matches and one line of context. After that lookup, submit the strategy.
        Use up to three confrontations whose exact text and source path appear in those results.
        A generated matter summary is background. Use a quotation or prior statement only when the
        results contain the actual primary source. With no primary-source match, leave confrontations empty.
        Return a compact JSON strategy with topics, confrontations (with exact source paths), and vulnerabilities.
        Include only the strongest relevant items. An empty confrontations string is valid.

        Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
      json:
        type: object
        required: [topics, confrontations, vulnerabilities]
        properties:
          topics: { type: string, maxLength: 1000 }
          confrontations: { type: string, maxLength: 1200 }
          vulnerabilities: { type: string, maxLength: 600 }
        additionalProperties: false
      as: strategy

    - kind: value
      value: { stop: false, transcript: "" }
      as: initial

    - kind: while
      label: examination
      on: "{initial}"
      condition: { eq: [stop, false] }
      max: 5
      body:
        kind: sequence
        steps:
          - kind: agent
            profile: xexam-question-generator
            label: question
            task: |-
              Ask the next cross-examination question.
              Witness: {params.witness}
              Case facts: {params.case_facts}

              STRATEGY:
              {strategy}

              TRANSCRIPT SO FAR (empty on the first question):
              {current.transcript}

              Return JSON with question (one short interrogative sentence), topic (3-6 words), and
              move (follow-up | new-topic | confront-document | impeach).
              Treat allegations and earlier questions as prompts only. The only testimony in this
              exercise is the witness's COMMENT. Say "you testified" or "you admitted" only if an
              earlier witness COMMENT actually contains the stated testimony or admission.
              If you already asked about a document or event and the witness did not recall,
              move to a distinct topic or ask a new, narrowly focused follow-up.

              Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
            json:
              type: object
              required: [question, topic, move]
              properties:
                question: { type: string, minLength: 1, maxLength: 450 }
                topic: { type: string, maxLength: 160 }
                move: { enum: [follow-up, new-topic, confront-document, impeach] }
              additionalProperties: false
            as: q

          - kind: switch
            label: witness-answer
            on: "{params.run_id}"
            cases:
              - when: { eq: ["", ""] }
                then:
                  kind: value
                  value: |-
                    DECISION: skipped
                    COMMENT: I do not recall beyond the facts provided, and I would need to review the underlying records before answering further.
            else:
              kind: agent
              profile: attorney-gate
              label: witness-answer-agent
              task: |-
                Call the attorney_review tool exactly once with:
                - run_id: "{params.run_id}"
                - title: "Cross-examination - answer as the witness"
                - summary: exactly these lines:
                  "**Q ({q.move}, {q.topic}):** {q.question}"
                  ""
                  "Answer as the witness would in the note below, then Approve to continue. Type \"end simulation\" to stop."
                Then submit the tool's returned text (the DECISION and COMMENT lines) verbatim as your result.
            as: answer

          - kind: agent
            profile: xexam-answer-scorer
            label: scorer
            task: |-
              Score the witness's answer to this turn.
              Witness: {params.witness}
              Case facts: {params.case_facts}

              QUESTION: {q.question}   (topic: {q.topic}, move: {q.move})

              WITNESS ANSWER (the COMMENT text below is the answer; ignore the DECISION line):
              {answer}

              TRANSCRIPT SO FAR:
              {current.transcript}

              Return JSON with:
              - evasion, consistency, damage: integers 0-10
              - coachingNote: choose the listed truthful-answer practice most relevant to the actual COMMENT
              - stop: true when the answer is empty, says "end simulation", or the witness plainly has
                nothing further to give; otherwise false. An answer of no recall alone is not a stop signal.

              All scores measure risk (higher is worse). Lack of recall alone is neither a contradiction
              nor an admission. Score damage only for an actual harmful admission in the answer, and
              consistency only for contradictions to supplied statements. Never infer privilege,
              dishonesty, motive, or intent from a limited answer.

              Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
            json:
              type: object
              required: [evasion, consistency, damage, coachingNote, stop]
              properties:
                evasion: { type: integer, minimum: 0, maximum: 10 }
                consistency: { type: integer, minimum: 0, maximum: 10 }
                damage: { type: integer, minimum: 0, maximum: 10 }
                coachingNote:
                  enum: &coaching-practices
                    - Pause to understand exactly what the question asks.
                    - Ask for clarification if the question is unclear or compound.
                    - Give a direct answer based on your actual recollection.
                    - Distinguish what you recall from what you would need to verify.
                    - State any limits of your knowledge and avoid speculation.
                stop: { type: boolean }
              additionalProperties: false
            as: score

          - kind: value
            value:
              stop: "{score.stop}"
              transcript: |-
                {current.transcript}

                ### Turn index {iteration} - {q.topic} ({q.move})
                **Question:** {q.question}

                **Witness response:**
                {answer}

                **Scores:** Evasion {score.evasion}/10 · Consistency {score.consistency}/10 · Damage {score.damage}/10
                **Coaching note:** {score.coachingNote}

      as: exam

    - kind: agent
      profile: xexam-debriefer
      label: debrief-analysis
      thinking: low
      task: |-
        Write the cross-examination debrief for {params.witness}.

        Return a JSON object with executiveSummary, reviewFocus, weakestMoments, patterns,
        coaching, and limitations. Refer to the zero-based turn indices only. Focus on actual
        questions, witness responses and scores. Prefix every inference with `Assessment:`.
        Do not repeat underlying allegations, exhibits, prior statements or case metadata.
        A DECISION: skipped turn uses the same fixed terminal response. Its repetition does
        not support a finding about the witness's demeanor, preparation, or intent.

        In reviewFocus, write 3-8 unchecked tasks. Every checklist line MUST begin exactly
        `- [ ] HIGH —`, `- [ ] MEDIUM —`, or `- [ ] LOW —`. Map damage of 8-10 to HIGH,
        5-7 to MEDIUM, and below 5 to LOW. Ground each issue in an actual turn and use
        a truthful-answer practice as its action.
        Choose exactly three distinct truthful-answer practices for coaching, with the turn
        index that illustrates each. Coaching must not script testimony or advise an admission,
        denial, different recollection, or tactic for counsel.

        Analyze only the transcript and scores:
        {exam.transcript}

        Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
      json:
        type: object
        required: [executiveSummary, reviewFocus, weakestMoments, patterns, coaching, limitations]
        properties:
          executiveSummary: { type: string, maxLength: 1000 }
          reviewFocus: { type: string, maxLength: 1800 }
          weakestMoments: { type: string, maxLength: 1400 }
          patterns: { type: string, maxLength: 1000 }
          limitations: { type: string, maxLength: 700 }
          coaching:
            type: array
            minItems: 3
            maxItems: 3
            items:
              type: object
              required: [turn, practice]
              properties:
                turn: { type: integer, minimum: 0, maximum: 4 }
                practice:
                  enum: *coaching-practices
              additionalProperties: false
        additionalProperties: false
      as: analysis

    - kind: value
      label: debrief
      value: |-
        # Cross-exam simulation - {params.witness}

        ## Executive summary
        {analysis.executiveSummary}

        ## Attorney review focus
        {analysis.reviewFocus}

        ## Weakest moments
        {analysis.weakestMoments}

        ## Behavioural patterns
        {analysis.patterns}

        ## Coaching recommendations
        - Turn {analysis.coaching.0.turn}: {analysis.coaching.0.practice}
        - Turn {analysis.coaching.1.turn}: {analysis.coaching.1.practice}
        - Turn {analysis.coaching.2.turn}: {analysis.coaching.2.practice}

        ## Transcript
        {exam.transcript}

        ## Limitations
        {analysis.limitations}
      as: draft

    # Quality guards (see the orchestrator-guards block in doc): Clef checks the finished report,
    # and the result is appended to it, so the attorney reviews the report and its guard section together.
    - kind: switch
      label: quality-guards
      on: "{params.run_id}"
      cases:
        - when: { eq: ["", ""] }
          then:
            kind: value
            value: |-
              ## Quality guards
              Terminal run: score with `npm run guards -- --workflow=cross-exam-simulation --run=<run-id>`.
      else:
        kind: agent
        profile: guard-gate
        label: quality-guards-agent
        task: |-
          Call the report_guard tool exactly once with run_id "{params.run_id}".
          Then submit the tool's returned Markdown verbatim as your result.
      as: guards

    - kind: value
      label: guarded-report
      value: |-
        {draft}

        {guards}
      as: report
display: report
