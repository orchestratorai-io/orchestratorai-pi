name: persistent-case-team
description: Grow a living matter record from a batch of documents. A facts team extracts entities and the timeline while a documents team classifies and indexes, all merged with the record from previous runs, and the updated record is written back to the matter folder.
trigger: when the user asks to add documents to a matter or update a matter record
params:
  - { name: target, required: true, description: "Folder holding the new document batch" }
  - { name: matter_record, default: "matters/matter-record.md", description: "Path of the living matter record to read and rewrite" }
  - { name: matter_name, default: "Untitled matter", description: "Matter name" }
  - { name: run_id, default: "", description: "OrchestratorAI run id (set by the app; leave empty from the TUI)" }
doc: |-
  Composition: inventory -> separate entity, timeline, and document-index extracts, one at a time ->
  record writer -> source validator -> attorney summary of what changed.
  Adapted from orchestratorai-local `legal/workflows/persistent-case-team`. On Pi the durable state is
  the matter-record Markdown file, so running another batch updates the same record. The writer and
  validator may modify only the matter-record path.

  ```orchestrator-launch
  title: Matters
  icon: briefcase
  group: litigation
  file: { kind: folder, label: document batch folder, param: target }
  fields:
    - { param: matter_name, label: Matter, kind: line, default: "Harbor Peak v. Aspen Devices" }
    - { param: matter_record, label: Record path, kind: line, default: "matters/harbor-peak/matter-record.md" }
  samples:
    - { title: Harbor Peak document batch (synthetic), path: fixtures/dealroom }
  review:
    focusTitle: Attorney review focus
    focusSubtitle: Check new entities, date conflicts, and anything the batch contradicts in the existing record.
    blurb: Confirm what this batch added to the matter record. Recording Approve or Request changes completes the attorney-review checkpoint.
  ```

  ```orchestrator-guards
  step: report
  checks:
    - { guard: citations, record: ["{params.target}"], skip: [Limitations, Quality guards] }
    - { guard: severity }
  ```
flow:
  kind: sequence
  steps:
    - kind: agent
      profile: document-inventory
      label: inventory
      task: |-
        Inventory every readable document in the folder {params.target}.
        Use ls and find to enumerate it, then read enough of each file to classify it.
        Each `path` must be the exact path a read tool can open (include the folder prefix).
        Exclude README/index files, hidden files, binaries, and {params.matter_record}. Summarize each
        document’s role in one sentence of at most 280 characters, grounded in that document.

        Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
      json:
        type: object
        required: [documents]
        properties:
          documents:
            type: array
            minItems: 1
            items:
              type: object
              required: [path, name, type, summary]
              properties:
                path: { type: string, minLength: 1 }
                name: { type: string }
                type: { type: string }
                summary: { type: string, maxLength: 280 }
              additionalProperties: false
          note: { type: string }
        additionalProperties: false
      as: inventory

    - kind: parallel
      label: matter-teams
      concurrency: 1
      branches:
        entities:
          kind: agent
          profile: matter-entity-extractor
          label: entity-extractor
          task: |-
            Update the entity list for matter "{params.matter_name}".
            Previous record: {params.matter_record}
            If that exact path is missing, start fresh. Read only that path and the incoming paths
            below. Treat sibling records as unrelated.
            New documents in this batch (read each):
            {inventory.documents}

            CLOSED RECORD: submit only compact entity rows, one per named entity, with exact citations.
            Use the existing record’s entity section when available. Preserve a legacy
            detail only with its cited source; mark unsupported legacy detail `[VERIFY LEGACY]`. Do not
            infer aliases, roles, relationships, dates, amounts, or legal conclusions.
            Entities are ONLY named people and organizations with a matter role; never list dates,
            jurisdictions, categories, anonymous groups, money, percentages, products, documents,
            frameworks, or missing attachments as entities.

            Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
        timeline:
          kind: agent
          profile: matter-timeline-extractor
          label: timeline-extractor
          task: |-
            Update the timeline for matter "{params.matter_name}".
            Previous record: {params.matter_record}
            If that exact path is missing, start fresh. Read only that path and the incoming paths
            below. Treat sibling records as unrelated.
            New documents in this batch (read each):
            {inventory.documents}

            CLOSED RECORD: submit only compact timeline rows, one per dated event, with exact citations.
            Use the existing record’s timeline section when available. Use only exact stated dates and
            omit undated material. Preserve legacy rows with their cited source and mark unsupported
            detail `[VERIFY LEGACY]`. Prefix significance with `Assessment:`.

            Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
        documents:
          kind: agent
          profile: matter-document-indexer
          label: document-indexer
          task: |-
            Update the document index for matter "{params.matter_name}".
            Previous record: {params.matter_record}
            If that exact path is missing, start fresh. Read only that path and the incoming paths
            below. Treat sibling records as unrelated.
            New documents in this batch (read each):
            {inventory.documents}

            CLOSED RECORD: submit compact document rows and a separate short list of unresolved
            prior open questions, if any, with their original citations. Use the existing record’s
            index and open-questions sections when available. Keep genuinely inherited rows with their cited paths. For incoming documents,
            index each exact path once and copy dates, parties, amounts, triggers, and conditions exactly.
            Use `not stated` rather than infer. Mark unsupported legacy detail `[VERIFY LEGACY]`.

            Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
      as: extracted

    - kind: agent
      profile: matter-record-writer
      label: record-writer
      task: |-
        Write the updated matter record for "{params.matter_name}".
        Write the complete merged record to exactly this path and no other file: {params.matter_record}
        (create the directory path implicitly by writing the file; do not write anywhere else).

        MERGED ENTITIES:
        {extracted.entities}

        MERGED TIMELINE:
        {extracted.timeline}

        MERGED DOCUMENT INDEX:
        {extracted.documents}

        Then submit the attorney-facing summary of this update as your result - what is new, what
        conflicts appeared, and the open questions. Do not submit the whole record.

        CLOSED RECORD: the complete record must stay under 1,800 words and the update summary under 500.
        Add no facts beyond the three extracts; preserve `Assessment:` and `[VERIFY LEGACY]` labels.
        Every factual summary bullet must cite an exact new-batch path. Prefix proposed actions with
        `Recommendation:` and never report legacy facts as additions.

        THE WRITTEN FILE MUST HAVE EXACTLY this structure and no other headings or narrative:
        `# Matter record - {params.matter_name}`; `## Parties and entities` with columns
        `Entity | Type | Role in the matter | First seen | Sources`; `## Timeline` with columns
        `Date | Event | Parties | Significance | Source`; `## Document index` with columns
        `Path | Type | Date | Parties | Summary`; `## Open questions` bullets; `## Record metadata`
        containing `Updated: generated locally · Documents indexed: <integer>`.
        Never paste extracts or add overview/category/detail headings.
        Never calculate interest, totals, percentages, dates, or consequences. Keep share classes,
        contract clauses, caps, and remedies separate. Check the schema and source values before the
        single write. Confirm the write succeeded. The next step performs the independent source check.
        Timeline includes ONLY events with an exact date explicitly printed in a source, sorted in strict
        ascending order. Omit undated facts from the timeline. Every open-question bullet ends with an
        exact source path. Keep inherited open questions from the document extract unless the new
        sources resolve them. Use `[VERIFY LEGACY]` only for an actual prior-record detail.
        Because this record path may be new: if no prior record was read, emit no `[VERIFY LEGACY]` tags.
        Entity Type must be exactly `Person` or `Organization`; First seen must be an exact source path.
        Preserve every stated quantity exactly. Keep a document's issue date separate from dates of
        events described inside it; never merge unrelated dates.

        Metadata must say exactly `Updated: generated locally`; never invent or copy a date.
        Never append the update summary, a duplicate, or a snapshot to the written file.

        Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
      as: update

    - kind: agent
      profile: matter-record-validator
      label: record-validator
      task: |-
        Validate and, only where necessary, repair the completed matter record at exactly:
        {params.matter_record}

        Read every incoming source listed here before validating factual exactness:
        {inventory.documents}

        The record must have the exact five-section schema, stay under 1,800 words, cite exact paths for
        incoming findings, preserve exact quantities and dates, and contain no invented calculations or
        metadata date. Do not delete a cited legacy row because its source is outside this batch.
        Timeline rows must be strictly chronological by explicit source date; preserve range endpoints
        exactly and reject inverted ranges. Keep a document's issue date separate from dates of events
        described inside it. Remove `[VERIFY LEGACY]` from any question directly supported
        by an incoming cited source. Metadata must say `Updated: generated locally`; `Documents indexed`
        must equal the number of distinct document-index rows in the completed record.

        Check customer/provider roles, factual amounts, and actual trigger status before chronology.
        If repair is needed, prepare the complete corrected record and use one write. Read it back
        once. Report any remaining discrepancies for counsel in the validation checklist.

        Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
      as: validation

    - kind: agent
      profile: matter-report-writer
      label: report
      task: |-
        Write the batch update report for matter "{params.matter_name}".

        The first line must be exactly:
        # Matter update - {params.matter_name}
        Then: ## What this batch added, ## Attorney review focus, ## New entities, ## Timeline changes,
        ## Documents indexed, ## Conflicts and open questions, ## Record location.

        Under ## Attorney review focus every checklist line MUST begin exactly `- [ ] HIGH —`,
        `- [ ] MEDIUM —`, or `- [ ] LOW —`. Date/fact conflicts, privilege, defaults/remedies, ownership,
        and material financial/contract issues are HIGH; unresolved identities and ambiguities are MEDIUM;
        LOW is only administrative incompleteness with no stated legal or financial consequence.
        Prefer 3-8 items. State the record path {params.matter_record} under ## Record location.

        UPDATE SUMMARY:
        {update}

        RECORD VALIDATION:
        {validation}

        BATCH INVENTORY:
        {inventory.documents}

        CLOSED RECORD: stay under 2,000 words and discuss only this new batch. Every factual statement
        must cite an exact incoming path. Preserve exact dates, amounts, percentages, triggers, remedies,
        and conditional language. Add no outside law, inferred chronology, arithmetic, privilege conclusion,
        or fact from the generated record. Prefix synthesis with `Assessment:` and actions with
        `Recommendation:`. Use `not stated` for silence.
        Keep share classes, clauses, caps, and remedies separate; never transfer rights between them,
        call a service-credit cap a liability cap, or convert a possible remedy/default into certainty.
        Apply source corrections from validation to the update summary. Keep measured observations,
        thresholds, and conditional remedies separate. Leave uncertain legal effects for counsel.
        Missing employee/contractor IP assignments, wage claims, and an open government audit are HIGH,
        never MEDIUM or LOW. Every entity and timeline bullet needs its own exact incoming path; do not
        use collective attribution or claim a source document is unavailable when it is in the batch.
        Keep a document's issue date separate from dates of events described inside it. Sub-processor
        notice/list discrepancies and a missing security report are HIGH or MEDIUM, never LOW.

        Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
      as: draft

    # Quality guards (see the orchestrator-guards block in doc): Clef checks the finished report,
    # and the result is appended to it, so the attorney reviews the report and its guard section together.
    - kind: value
      label: quality-guards
      value: |-
        ## Quality guards

        - **Quality guards: Pending local scorecard.** Run the repository's local scorecard after completion.
      as: guards

    - kind: value
      label: guarded-report
      value: |-
        {draft}

        {guards}
      as: report
display: report
