name: due-diligence
description: Work an entire deal room. Every document is classified and analysed, findings are cross-referenced into a risk matrix with deal-breaker flags, and counsel reviews twice - once on the per-document findings and again on the synthesis - before the diligence report is written.
trigger: when the user asks to run due diligence over a deal room or document set
params:
  - { name: target, required: true, description: "Folder holding the deal room documents" }
  - { name: transaction, default: "Proposed acquisition; buyer-side diligence.", description: "Transaction context" }
  - { name: context, default: "Identify risks, deal-breakers, and missing materials for buyer-side counsel.", description: Objective }
  - { name: run_id, default: "", description: "OrchestratorAI run id (set by the app; leave empty from the TUI)" }
doc: |-
  Composition: inventory -> map(documents, one at a time) analyst -> **gate 1** (per-document findings) ->
  synthesis -> **gate 2** (risk matrix) -> report.
  Ported from orchestratorai-local `legal/workflows/due-diligence`, which has the same two attorney gates.

  ```orchestrator-launch
  title: Due Diligence
  icon: magnifyingglass.circle
  group: transactional
  file: { kind: folder, label: deal room folder, param: target }
  fields:
    - { param: transaction, label: Transaction, kind: text }
    - { param: context, label: Objective, kind: text }
  samples:
    - { title: Cedar Analytics deal room (synthetic), path: fixtures/dealroom }
  review:
    focusTitle: Attorney review focus
    focusSubtitle: Work the deal-breakers and critical risks first. Every risk traces back to the document it came from.
    blurb: Confirm the risk matrix and deal-breaker analysis. Recording Approve or Request changes completes the attorney-review checkpoint - not a legal opinion.
  ```

  ```orchestrator-guards
  step: report
  checks:
    - { guard: citations, record: ["{params.target}"], skip: [Limitations, Reviewer decisions, Quality guards] }
    - { guard: severity }
  ```
flow:
  kind: sequence
  steps:
    - kind: agent
      profile: document-inventory
      label: inventory
      task: |-
        Inventory every readable document in the folder {params.target}.
        Use ls and find to enumerate it, then read enough of each file to classify it.
        Each `path` must be the exact path a read tool can open (include the folder prefix).
        Exclude README files, hidden files, and directory indexes from the deal-room corpus.

        Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
      json:
        type: object
        required: [documents]
        properties:
          documents:
            type: array
            minItems: 1
            items:
              type: object
              required: [path, name, type, summary]
              properties:
                path: { type: string, minLength: 1 }
                name: { type: string }
                type: { type: string }
                summary: { type: string }
              additionalProperties: false
          note: { type: string }
        additionalProperties: false
      as: inventory

    - kind: map
      label: analyse
      over: "{inventory.documents}"
      concurrency: 1
      body:
        kind: agent
        profile: dd-document-analyst
        label: analyst
        task: |-
          Required source: {item.path}
          Diligence evidence: {item.path}
          Analyse deal-room document {index}: {item.name} (type: {item.type})
          Use the primary source provided by Pi. If it was not supplied inline, call the read tool
          on {item.path} before classifying or writing any finding. If unreadable, submit an error.
          Transaction: {params.transaction}
          Objective: {params.context}

          Head your output `## {item.name}` with the exact path. Write a compact list of material
          source-backed findings. Combine related terms, risks, conditions, and consequences on the
          same line so the next stage receives each fact once.
          Start with the instrument title and exact named parties and roles, including which party
          owns each consent right or remedy.
          CLOSED RECORD: aim for 350 words and use only this document. Do not add outside law, regulatory
          history/dates, fine caps, market practice, assumed documents, or arithmetic not printed in the source.
          For Privacy Shield say only `the DPA relies on Privacy Shield; no SCCs are attached; [VERIFY] legal effect`.
          Never mention invalidity, CJEU, Schrems, 2020, elapsed non-compliance, or fine amounts. List a missing
          material only if this document references it as absent; otherwise label the request `Recommendation:`.

          Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
      as: findings

    - kind: switch
      label: gate-1-analysis
      on: "{params.run_id}"
      cases:
        - when: { eq: ["", ""] }
          then: { kind: value, value: "DECISION: skipped\nCOMMENT: Terminal run; no document-analysis corrections recorded." }
      else:
        kind: agent
        profile: attorney-gate
        label: gate-1-analysis-agent
        task: |-
          Call the attorney_review tool exactly once with:
          - run_id: "{params.run_id}"
          - title: "Gate 1 - review document classifications and findings"
          - summary: the DOCUMENT INVENTORY and the complete FINDINGS below, preceded by one line:
            "Approve to proceed to synthesis, or request changes and say which documents were misrouted or need re-analysis."
          Then submit the tool's returned text (the DECISION and COMMENT lines) verbatim as your result.

          DOCUMENT INVENTORY:
          {inventory.documents}

          FINDINGS:
          {findings}
      as: gate1

    - kind: agent
      profile: dd-synthesizer
      label: synthesis
      task: |-
        Diligence evidence: {params.target}
        Synthesize the deal room at {params.target}.
        Transaction: {params.transaction}
        Objective: {params.context}

        ATTORNEY DIRECTION FROM GATE 1 (apply any correction it gives):
        {gate1}

        DOCUMENT INVENTORY:
        {inventory.documents}

        PER-DOCUMENT FINDINGS:
        {findings}
        Keep the synthesis under 1,500 words. Give each risk one canonical row with the exact source
        and conditional consequence. Reference risk IDs from the other sections instead of repeating
        the evidence or recommendations. Preserve exact source facts and conditional language; prefix
        every inference with `Assessment:` and every proposed action with `Recommendation:`.
        This is a closed-record synthesis: do not add outside law, regulatory history, fine caps, legal-validity
        conclusions, or market practice. Use `[VERIFY]` when the supplied findings do not establish a conclusion.

        Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
      as: matrix

    - kind: switch
      label: gate-2-synthesis
      on: "{params.run_id}"
      cases:
        - when: { eq: ["", ""] }
          then: { kind: value, value: "DECISION: skipped\nCOMMENT: Terminal run; no risk-matrix corrections recorded." }
      else:
        kind: agent
        profile: attorney-gate
        label: gate-2-synthesis-agent
        task: |-
          Call the attorney_review tool exactly once with:
          - run_id: "{params.run_id}"
          - title: "Gate 2 - review the risk matrix and deal-breaker flags"
          - summary: the complete RISK MATRIX below, unchanged, preceded by one line:
            "Approve to write the report, or request changes and say what to refine."
          Then submit the tool's returned text (the DECISION and COMMENT lines) verbatim as your result.

          RISK MATRIX:
          {matrix}
      as: gate2

    - kind: agent
      profile: dd-report-writer
      label: report
      task: |-
        Diligence evidence: {params.target}
        Write the final diligence report for the deal room at {params.target}.
        Transaction: {params.transaction}
        Objective: {params.context}

        The first line must be exactly:
        # Due diligence - [deal or room name]
        Then: ## Executive summary, ## Attorney review focus, ## Risk matrix, ## Deal-breaker analysis,
        ## Cross-document findings, ## Missing materials, ## Reviewer decisions, ## Limitations.

        Under ## Attorney review focus list unchecked tasks `- [ ] SEVERITY — issue; action`, mapping
        CRITICAL and HIGH risks to HIGH. Prefer 5-10 items; lead with deal-breakers.
        If either gate requested changes, address the COMMENT explicitly in the affected sections.
        Every checklist line MUST begin exactly with `- [ ] HIGH —`, `- [ ] MEDIUM —`, or `- [ ] LOW —`.
        A skipped gate records no correction. Keep the report under 1,600 words, preserve exact conditional
        language, and label every inference `Assessment:` and proposed action `Recommendation:`.
        Do not add outside law, regulatory history, fine caps, legal-validity conclusions, or market practice;
        keep unsupported legal conclusions marked `[VERIFY]`.
        For Privacy Shield, state only that the DPA relies on it and no SCCs are attached, then `[VERIFY] legal effect`;
        omit invalidity, CJEU, Schrems, 2020, elapsed non-compliance, and fine amounts even if the matrix added them.
        FINAL SANITIZATION IS REQUIRED: replace every claim that Privacy Shield is invalid/non-compliant with the
        record-only wording above. List a missing material only when the matrix ties it to a source reference;
        prefix inferred document requests `Recommendation:` and never invent their title, date, meeting, or existence.
        CHECKLIST CALIBRATION: include substantive risks only, never gate status or skipped-decision text. Litigation,
        IP title, regulatory, financing, consent, and price/escrow items must be HIGH or MEDIUM, never LOW. LOW is
        only for administrative/cosmetic follow-up that cannot materially affect closing, price, liability, or ownership.
        Undisclosed or unapproved sub-processors must be HIGH or MEDIUM, never LOW.
        Material contractual security, breach-notification, and data-retention risks are at least MEDIUM.
        Preserve every material risk from the matrix. Use risk IDs to point back to the matrix
        from the deal-breaker and cross-document sections, without repeating full findings.
        Copy only expressly stated numerical figures. Omit calculated percentages, totals, or
        ownership majority inferences even if the matrix includes them. State thresholds and
        observations separately and preserve optional remedies with their exact conditions.
        Mark a proposed buyer closing condition `Recommendation:` rather than treating it as binding.
        Keep the lender, customer, and equity-holder roles separate. Use the party roster when
        checking who has each consent right or remedy. If the roster and matrix conflict,
        give the exact source path and mark the attribution `[VERIFY]`.

        GATE 1 DECISION: {gate1}
        GATE 2 DECISION: {gate2}

        DOCUMENT INVENTORY:
        {inventory.documents}

        RISK MATRIX AND CROSS-DOCUMENT FINDINGS:
        {matrix}

        Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
      as: draft

    # Quality guards (see the orchestrator-guards block in doc): Clef checks the finished report,
    # and the result is appended to it, so the attorney reviews the report and its guard section together.
    - kind: switch
      label: quality-guards
      on: "{params.run_id}"
      cases:
        - when: { eq: ["", ""] }
          then: { kind: value, value: "## Quality guards\nTerminal run: score with `npm run guards -- --workflow=due-diligence --run=<run-id>`." }
      else:
        kind: agent
        profile: guard-gate
        label: quality-guards-agent
        task: |-
          Call the report_guard tool exactly once with run_id "{params.run_id}".
          Then submit the tool's returned Markdown verbatim as your result.
      as: guards

    - kind: value
      label: guarded-report
      value: |-
        {draft}

        {guards}
      as: report
display: report
